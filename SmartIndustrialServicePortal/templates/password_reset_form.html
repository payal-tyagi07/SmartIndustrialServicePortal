{% extends 'base.html' %}
{% block title %}Choose New Password - Smart Industrial Portal{% endblock %}
{% block public_content %}
<div class="auth-wrapper"><div class="auth-card">
  <div class="auth-header"><h1>Choose a New Password</h1><p>Use at least 12 characters.</p></div>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label for="password">New Password</label><input id="password" type="password" name="password" minlength="12" required autocomplete="new-password"></div>
    <div class="form-group"><label for="confirm_password">Confirm Password</label><input id="confirm_password" type="password" name="confirm_password" minlength="12" required autocomplete="new-password"></div>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</div></div>
{% endblock %}
