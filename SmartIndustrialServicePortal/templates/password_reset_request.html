{% extends 'base.html' %}
{% block title %}Reset Password - Smart Industrial Portal{% endblock %}
{% block public_content %}
<div class="auth-wrapper"><div class="auth-card">
  <div class="auth-header"><h1>Reset Password</h1><p>Enter your registered email address.</p></div>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="email"></div>
    <button class="btn btn-primary" type="submit">Send reset link</button>
  </form>
</div></div>
{% endblock %}
